[package]
name = "sugoi"
version = "0.5.3"
authors = [ "frahz <me@frahz.dev>" ]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
askama = "0.16"
axum = { version = "0.8", features = ["json"] }
jiff = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
low = { git = "https://github.com/frahz/low.git", tag = "0.3.1" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.7", features = ["compression-full", "fs"] }
async-sqlite = "0.6"
rusqlite = "0.40"
git-version = "0.3"

[profile.release]
strip = "symbols"
